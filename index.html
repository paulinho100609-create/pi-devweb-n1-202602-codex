<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essenzya | Início</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
    <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Logo Essenzya">
    </a>

    <nav class="menu-principal">
        <div class="barra-pesquisa">
            <input type="text" id="campoPesquisa" placeholder="Buscar produtos...">
            <button type="button" onclick="pesquisar()">Buscar</button>
        </div>

        <a href="login.html" id="linkConta">Minha Conta</a>

        <button id="btnSair" onclick="sair()" style="display:none;">
            Sair
        </button>

        <a href="carrinho.html" class="link-carrinho" title="Meu carrinho">
            <img src="img/carrinho.png" alt="Carrinho de compras">
            <span id="contadorCarrinho">0</span>
        </a>
    </nav>
</header>

<div id="mensagem"></div>

<section class="carrossel">
    <div class="slide ativo">
        <img src="img/essenzya.jpg" alt="Destaque Essenzya">
    </div>

    <div class="slide">
        <img src="img/criação.essenzya.jpg" alt="Criação Essenzya">
    </div>

    <div class="slide">
        <img src="img/modelo.prin.jpg" alt="Modelo Essenzya">
    </div>

    <button class="anterior" onclick="mudarSlide(-1)">&#10094;</button>
    <button class="proximo" onclick="mudarSlide(1)">&#10095;</button>

    <div class="indicadores">
        <span class="ponto ativo" onclick="irParaSlide(0)"></span>
        <span class="ponto" onclick="irParaSlide(1)"></span>
        <span class="ponto" onclick="irParaSlide(2)"></span>
    </div>
</section>

<main>
    <section class="secao-produtos">
        <h1>Produtos em Alta</h1>
        <p class="subtitulo-produtos">
            Confira alguns dos produtos destacados da nossa coleção.
        </p>

        <div id="produtosEmAlta" class="lista-produtos"></div>
    </section>

    <section class="secao-produtos secao-catalogo">
        <h1>Nossos Produtos</h1>
        <p class="subtitulo-produtos">
            Encontre sua próxima peça favorita.
        </p>

        <div class="filtros-catalogo">
            <div class="area-categorias">
                <button
                    type="button"
                    class="botao-categorias"
                    onclick="alternarMenuCategorias()"
                    aria-expanded="false"
                >
                    <span id="textoBotaoCategoria">Todas as categorias</span>
                    <span id="setaCategorias">▼</span>
                </button>

                <div class="menu-categorias" id="menuCategorias">
                    <button type="button" data-categoria="todas"
                        onclick="selecionarCategoria('todas')">
                        Todas as categorias
                    </button>
                    <button type="button" data-categoria="feminino"
                        onclick="selecionarCategoria('feminino')">
                        Feminino
                    </button>
                    <button type="button" data-categoria="masculino"
                        onclick="selecionarCategoria('masculino')">
                        Masculino
                    </button>
                    <button type="button" data-categoria="blusa"
                        onclick="selecionarCategoria('blusa')">
                        Blusa
                    </button>
                    <button type="button" data-categoria="calca"
                        onclick="selecionarCategoria('calca')">
                        Calça
                    </button>
                </div>
            </div>

            <p id="categoriaSelecionada">Exibindo: todas as categorias</p>
        </div>

        <div id="resultadoPesquisa"></div>
        <div id="listaProdutosInicio" class="lista-produtos"></div>
    </section>

    <section class="area-sobre-nos">
        <a href="sobre.html" class="botao-sobre-nos">
            <span class="sobre-chamada">Conheça a Essenzya</span>
            <strong>Sobre Nós</strong>
            <span class="sobre-seta">→</span>
        </a>
    </section>
</main>

<footer>
    <p>&copy; 2026 Essenzya. Todos os direitos reservados.</p>
</footer>

<script src="script.js"></script>
<script src="catalogo.js"></script>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>
</html>
